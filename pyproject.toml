[project]
name = "inmet-data-pipeline"
version = "1.1.0"
description = "Pipeline ETL incremental para dados meteorológicos do INMET com TimescaleDB."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "pandas>=2.0",
    "seaborn>=0.13",
    "matplotlib>=3.8",
    "sqlalchemy>=2.0",
    "jupyter>=1.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
bigquery = [
    "google-cloud-bigquery>=3.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
